apiVersion: v1
kind: Service
metadata:
  name: customers-api
  namespace: cafe-boreal
  labels:
    app: customers-api
    app.kubernetes.io/part-of: cafe-boreal

spec:
  type: ClusterIP

  selector:
    app: customers-api

  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
