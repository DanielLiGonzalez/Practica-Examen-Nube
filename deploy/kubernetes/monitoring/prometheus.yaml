apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: cafe-boreal
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets:
              - localhost:9090

      - job_name: cadvisor
        static_configs:
          - targets:
              - cadvisor:8080

      - job_name: loki
        static_configs:
          - targets:
              - loki:3100

      - job_name: grafana
        static_configs:
          - targets:
              - grafana:3000

      - job_name: promtail
        static_configs:
          - targets:
              - promtail:9080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: cafe-boreal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: prometheus
          image: prom/prometheus:v3.13.2
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
            - name: data
              mountPath: /prometheus
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cafe-boreal
spec:
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
