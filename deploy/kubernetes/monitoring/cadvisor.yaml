apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: cadvisor
  namespace: cafe-boreal
spec:
  selector:
    matchLabels:
      app: cadvisor
  template:
    metadata:
      labels:
        app: cadvisor
    spec:
      containers:
        - name: cadvisor
          image: ghcr.io/google/cadvisor:v0.60.5
          securityContext:
            privileged: true
          ports:
            - name: http
              containerPort: 8080
          args:
            - --housekeeping_interval=10s
          volumeMounts:
            - name: rootfs
              mountPath: /rootfs
              readOnly: true
            - name: var-run
              mountPath: /var/run
            - name: sys
              mountPath: /sys
              readOnly: true
            - name: docker
              mountPath: /var/lib/docker
              readOnly: true
            - name: containerd
              mountPath: /var/lib/containerd
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: rootfs
          hostPath:
            path: /
            type: Directory
        - name: var-run
          hostPath:
            path: /var/run
            type: Directory
        - name: sys
          hostPath:
            path: /sys
            type: Directory
        - name: docker
          hostPath:
            path: /var/lib/docker
            type: DirectoryOrCreate
        - name: containerd
          hostPath:
            path: /var/lib/containerd
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: cadvisor
  namespace: cafe-boreal
spec:
  selector:
    app: cadvisor
  ports:
    - name: http
      port: 8080
      targetPort: http
