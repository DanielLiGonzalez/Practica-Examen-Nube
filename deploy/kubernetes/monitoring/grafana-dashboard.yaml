apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: cafe-boreal
data:
  dashboards.yaml: |
    apiVersion: 1

    providers:
      - name: Cafe Boreal
        orgId: 1
        folder: Cafe Boreal
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cafe-boreal
  namespace: cafe-boreal
data:
  cafe-boreal.json: |
    {
      "title": "Cafe Boreal - Infraestructura y Servicios",
      "uid": "cafe-boreal-main",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "CPU por contenedor",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "Memoria por contenedor",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (container) (container_memory_working_set_bytes{container!=\"\"})",
              "legendFormat": "{{container}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Errores HTTP 5xx",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(count_over_time({namespace=\"cafe-boreal\"} |~ \" 5[0-9][0-9] \" [5m]))"
            }
          ]
        },
        {
          "id": 4,
          "title": "Logs Cafe Boreal",
          "type": "logs",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "datasource": {
            "type": "loki",
            "uid": "loki"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"cafe-boreal\"}"
            }
          ]
        }
      ]
    }
