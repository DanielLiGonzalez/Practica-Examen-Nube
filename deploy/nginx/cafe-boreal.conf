# CAFE-BOREAL-ITI522-X7K9-2026

server {
    listen 80;
    listen [::]:80;

    server_name localhost cafe-boreal;

    return 301 https://$host$request_uri;
}


server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name localhost cafe-boreal;

    ssl_certificate /etc/nginx/ssl/cafe-boreal.crt;
    ssl_certificate_key /etc/nginx/ssl/cafe-boreal.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/cafe-boreal;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://192.168.49.2;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /legacy/inventory {
        proxy_pass http://127.0.0.1:8080/legacy/inventory.php;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /legacy/ {
        proxy_pass http://127.0.0.1:8080/legacy/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
