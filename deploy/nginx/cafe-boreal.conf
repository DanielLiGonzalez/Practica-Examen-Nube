server {
    listen 80;
    listen [::]:80;

    server_name localhost cafe-boreal 172.24.138.214;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name localhost cafe-boreal 172.24.138.214;

    ssl_certificate /etc/nginx/ssl/cafe-boreal.crt;
    ssl_certificate_key /etc/nginx/ssl/cafe-boreal.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ =404;
    }
}
